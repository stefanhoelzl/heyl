[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
edition      = "2024"
rust-version = "1.91"
license      = "Apache-2.0"
repository   = "https://github.com/stefanhoelzl/heyl"
authors      = ["Stefan Hoelzl <st.hoelzl@googlemail.com>"]

# Declared once here; every crate opts in with `[lints] workspace = true`, so a
# crate that omits it is visible in its own manifest rather than invisible in a
# missing attribute.
[workspace.lints.rust]
unsafe_code   = "forbid"
missing_docs  = "deny"

[workspace.lints.clippy]
all           = { level = "deny", priority = -1 }
pedantic      = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
# --- §2 primitives. RustCrypto over dryoc; see DESIGN.md §4.
crypto_secretbox = "0.1"
crypto_box       = "0.9"
ed25519-dalek    = "3.0"
x25519-dalek     = "3.0"
sha2             = "0.11"
hmac             = "0.13"
argon2           = "0.6"
aes-gcm          = "0.11"
# --- memory hygiene. `region::lock` is a safe fn, so heyl-crypto keeps
#     `unsafe_code = "forbid"`. `secrets` was rejected: it links system
#     libsodium unconditionally.
zeroize          = "1.9"
region           = "4.0"
# --- domain
uuid             = { version = "1", features = ["serde", "v4"] }
base64           = "0.22"
snap             = "1"
# --- platform adapters
# keyring 4, default (`v1`) features: macOS Keychain, Windows Credential
# Manager, and Secret Service on Linux.
#
# NOT the `cli` feature, which additionally pulls `db-keystore` -- a
# file-backed credential store -- plus `keyring-core/sample` (a mock) and
# Apple's biometric-gated "protected" Keychain. An on-disk credential store is
# directly at odds with DESIGN.md §3, and none of it should be reachable here.
#
# NOT `linux-keyutils-keyring-store` either: `v1.rs` hardcodes the zbus
# Secret Service store on Linux, so enabling keyutils compiles it in without
# ever selecting it. Using it would mean calling `keyring_core::set_default_store`
# ourselves -- worth considering later, since a kernel keyring is not on disk,
# but it is a behaviour change (session-scoped, lost on reboot) rather than a
# feature flag.
keyring          = "4"
rpassword        = "7.5"
rand_core        = { version = "0.9", features = ["os_rng"] }
# A safe wrapper over setrlimit, so heyl-platform keeps `unsafe_code = "forbid"`
# -- the same reasoning that chose `region` over `secrets` for mlock.
rlimit           = "0.10"
clap             = { version = "4", features = ["derive", "env"] }
jiff             = "0.2"
serde            = { version = "1", features = ["derive"] }
thiserror        = "2"
# --- transport. Decided at M0 on measured criteria: 18x less generated code,
#     24x faster regeneration and a 41% smaller binary than connectrpc+buffa,
#     on a far more mature dependency. gRPC-Web is the only protocol the
#     backend serves, which is what made connectrpc's Connect support moot.
# tonic 0.14 moved prost support out into `tonic-prost`; `transport` would pull
# in a server and axum, so it stays off -- we drive our own hyper client.
tonic             = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-web         = "0.14"
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
prost             = "0.14"
prost-types       = "0.14"
hyper             = { version = "1", features = ["client", "http1", "http2"] }
hyper-util        = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
# No provider feature on either: `ring` and `aws-lc-rs` are both C projects
# driven by `cc`/`cmake`, which DESIGN.md §4 forbids. `rustls-graviola` supplies
# the `CryptoProvider` instead -- pure Rust plus formally-verified s2n-bignum
# assembly, whose only dependencies are `cfg-if` and `getrandom`. We build the
# `ClientConfig` ourselves, so hyper-rustls needs no provider of its own.
hyper-rustls      = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12"] }
rustls            = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola   = "0.4"
rustls-platform-verifier = "0.7"
http              = "1"
http-body         = "1"
http-body-util    = "0.1"
tower             = "0.5"
bytes             = "1"
tokio             = { version = "1", features = ["rt", "macros", "time"] }
async-trait       = "0.1"

# --- test only
insta            = "1"
proptest         = "1"
hex              = "0.4"
serde_json       = "1"

heyl-crypto   = { version = "0.0.0", path = "crates/heyl-crypto" }
heyl-domain   = { version = "0.0.0", path = "crates/heyl-domain" }
heyl-vault    = { version = "0.0.0", path = "crates/heyl-vault" }
heyl-ports    = { version = "0.0.0", path = "crates/heyl-ports" }
heyl-app      = { version = "0.0.0", path = "crates/heyl-app" }
heyl-proto    = { version = "0.0.0", path = "crates/heyl-proto" }
heyl-grpc     = { version = "0.0.0", path = "crates/heyl-grpc" }
heyl-platform = { version = "0.0.0", path = "crates/heyl-platform" }

# tonic-web 0.14.6 drops gRPC-Web trailers when they arrive in the same buffer
# as the final data frame, which makes any response over roughly 4 KiB fail with
# "missing grpc-status trailer". One-line fix in vendor/tonic-web; see its
# README. To be sent upstream -- and note a `[patch]` does **not** reach anyone
# installing `heyl` from crates.io, so this cannot be the answer past M8.
[patch.crates-io]
tonic-web = { path = "vendor/tonic-web" }

[profile.release]
lto       = true
strip     = true
panic     = "abort"
codegen-units = 1
