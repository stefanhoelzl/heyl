[package]
name        = "heyl-app"
version     = "0.0.0"
description = "`heyl`'s use cases: login, unlock, doctor. Internal; no API stability guarantee."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
heyl-crypto = { workspace = true }
heyl-domain = { workspace = true }
heyl-ports  = { workspace = true }
heyl-vault  = { workspace = true }
base64      = { workspace = true }
thiserror   = { workspace = true }
serde_json  = { workspace = true }
zeroize     = { workspace = true }

# Dev only. `cargo tree --edges normal` excludes these, so ci/check-dep-graph.sh
# still holds heyl-app to "must not depend on tokio" for the shipped graph.
[dev-dependencies]
async-trait = { workspace = true }
heyl-vault  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "macros"] }
