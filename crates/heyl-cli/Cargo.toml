[package]
name        = "heyl"
version     = "0.0.0"
description = "Unofficial command-line client for heylogin: retrieve passwords, TOTP codes and custom fields from your vault."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
# `heyl api`: the raw surface over every RPC in the schema, plus the pure
# crypto helpers that make a login hand-drivable.
#
# Default-off, and hidden even when built, because it is **unsafe by
# construction**: no guards, destructive RPCs reachable by name, key material
# printable. Use it against a throwaway account. Gating it as a feature rather
# than on `debug_assertions` is what keeps `prost-reflect` and the embedded
# descriptor out of the release dependency graph, which is a property
# `cargo tree` can check and `cfg` cannot.
api = ["heyl-grpc/api", "dep:base64", "dep:heyl-vault", "dep:thiserror"]

[[bin]]
name = "heyl"
path = "src/main.rs"

[dev-dependencies]
# The corpus lives behind heyl-grpc's `api` feature, so the offline suite gets
# it as a dev-dependency: `cargo tree -e normal` -- what ci/check-dep-graph.sh
# and DESIGN.md §4's pure-graph claim look at -- does not see dev edges, so the
# shipped binary's graph is unaffected.
heyl-grpc      = { workspace = true, features = ["api"] }
async-trait    = { workspace = true }
base64         = { workspace = true }
bytes          = { workspace = true }
http           = { workspace = true }
http-body-util = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt", "macros"] }
tonic-web      = { workspace = true }
zeroize        = { workspace = true }
tower          = { workspace = true }

[dependencies]
heyl-app      = { workspace = true }
heyl-crypto   = { workspace = true }
heyl-domain   = { workspace = true }
heyl-grpc     = { workspace = true }
heyl-platform = { workspace = true }
heyl-ports    = { workspace = true }
heyl-vault    = { workspace = true, optional = true }

base64      = { workspace = true, optional = true }
thiserror   = { workspace = true, optional = true }
clap        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
zeroize     = { workspace = true }
