[package]
name        = "heyl"
version     = "0.0.0"
description = "Unofficial command-line client for heylogin: retrieve passwords, TOTP codes and custom fields from your vault."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
build                  = "build.rs"

[lints]
workspace = true

[features]
# The workbench: `heyl api`, `heyl doctor`, `heyl recovery`, the `HEYL_ENDPOINT`
# override, and the scenario suite's two injected ports.
#
# What they have in common is not danger -- `doctor` only reads -- but audience.
# Each exists because someone is reverse-engineering a protocol, not because a
# password-manager user needs it. A release build is the product; this build is
# the lab. Point it at a throwaway account.
#
# Default-off, and a cargo feature rather than `cfg(debug_assertions)`, because
# that makes the exclusion a property of the dependency graph rather than of the
# source: `prost-reflect` and the embedded descriptor are absent from a default
# build, and a writable on-disk credential store cannot exist in a binary a user
# can get (DESIGN.md §3). `ci/check-dep-graph.sh` checks it -- a claim nobody
# runs is not a guarantee.
dev = ["heyl-grpc/api", "heyl-platform/test-ports"]

[[bin]]
name = "heyl"
path = "src/main.rs"

[dev-dependencies]
# The corpus lives behind heyl-grpc's `api` feature, so the offline suite gets
# it as a dev-dependency: `cargo tree -e normal` -- what ci/check-dep-graph.sh
# and DESIGN.md §4's pure-graph claim look at -- does not see dev edges, so the
# shipped binary's graph is unaffected.
heyl-grpc      = { workspace = true, features = ["api", "server"] }
async-trait    = { workspace = true }
base64         = { workspace = true }
bytes          = { workspace = true }
http           = { workspace = true }
http-body-util = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util"] }
tonic-web      = { workspace = true }
zeroize        = { workspace = true }
tower          = { workspace = true }

[dependencies]
heyl-app      = { workspace = true }
heyl-crypto   = { workspace = true }
heyl-domain   = { workspace = true }
heyl-grpc     = { workspace = true }
heyl-platform = { workspace = true }
heyl-ports    = { workspace = true }
heyl-vault    = { workspace = true }

# Not `optional = true`, though only the `dev` surface names them: all three are
# in a default build's graph through `heyl-app` regardless, so an opt-in would
# advertise an exclusion that never happens. What `dev` genuinely removes is
# `prost-reflect`, via `heyl-grpc/api`.
base64      = { workspace = true }
thiserror   = { workspace = true }
clap        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
zeroize     = { workspace = true }
