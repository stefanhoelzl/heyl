[package]
name        = "heyl-grpc"
version     = "0.0.0"
description = "gRPC-Web adapter implementing `heyl`'s HeylApi port. Internal; no API stability guarantee."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
# The `heyl api` dispatch: protobuf-JSON in both directions, and the embedded
# descriptor pool it needs. Default-off so the release graph does not contain
# `prost-reflect` at all -- DESIGN.md §4's pure-graph claim is checked with
# `cargo tree`, and a feature is the only gate `cargo tree` agrees with.
api = ["dep:prost-reflect", "dep:serde", "dep:serde_json"]

# heylogin on loopback: the corpus served over a real socket, or a proxy that
# forwards to the real backend and keeps what crossed. Both are the same
# server over a different `HeyloginApi`, which is what lets the binary record a
# scenario with no recording code of its own -- it only needs `HEYL_ENDPOINT`,
# which a `--features dev` build reads. Separate from `api` so `heyl`'s own
# `dev` feature does not drag an HTTP server into a build someone might run.
server = ["api", "dep:hyper", "dep:http-body-util"]

[build-dependencies]
prost       = { workspace = true }
prost-build = { workspace = true }
prost-types = { workspace = true }

[dependencies]
heyl-crypto = { workspace = true }
heyl-domain = { workspace = true }
heyl-ports  = { workspace = true }
heyl-proto  = { workspace = true }

async-trait  = { workspace = true }
base64       = { workspace = true }
bytes        = { workspace = true }
http         = { workspace = true }
http-body    = { workspace = true }
http-body-util = { workspace = true, optional = true }
hyper        = { workspace = true, optional = true, features = ["server", "http1"] }
hyper-rustls = { workspace = true }
hyper-util   = { workspace = true }
prost        = { workspace = true }
prost-types  = { workspace = true }
prost-reflect = { workspace = true, optional = true }
serde        = { workspace = true, optional = true }
serde_json   = { workspace = true, optional = true }
tokio-stream = { workspace = true }
rustls       = { workspace = true }
rustls-graviola = { workspace = true }
rustls-platform-verifier = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tonic        = { workspace = true }
tonic-prost  = { workspace = true }
tonic-web    = { workspace = true }
tower        = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
http        = { workspace = true }
hex         = { workspace = true }
base64      = { workspace = true }
async-trait = { workspace = true }
heyl-proto  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "macros"] }
bytes       = { workspace = true }
http-body-util = { workspace = true }
tonic-web   = { workspace = true }
tower       = { workspace = true }
