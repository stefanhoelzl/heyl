syntax = "proto3";

package domain;

option go_package = "gitlab.com/cotechde/monorepo/backend/domain/pb";

message LoginClientPubKeyBody {
  bytes client_pub_key = 1;
}

message LoginAuthenticatorPubKeyBody {
  bytes authenticator_pub_key = 2;
}

message LoginHashCommitmentBody {
  bytes hash_commitment = 3;
}

message LoginEncryptedSecretBody {
  bytes encrypted_secret = 1;
  string authenticator_id = 2;
}

