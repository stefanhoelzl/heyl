syntax = "proto3";

package domain;

import "google/protobuf/any.proto";

option go_package = "gitlab.com/cotechde/monorepo/backend/domain/pb";

message DomainError {
  int32 code = 1;
  string user_title = 3;
  string user_detail = 4;
  string request_id = 5;
}

message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}

